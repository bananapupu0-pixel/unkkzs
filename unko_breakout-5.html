<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>うんこ崩し 💩</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(#9edcff 0 70%, #80cf75 70%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { width: min(94vw, 720px); text-align: center; }
  h1 { margin: 6px 0; font-size: clamp(24px, 5vw, 40px); }
  canvas {
    width: 100%; height: auto; display: block;
    background: linear-gradient(#bfe9ff, #f8fdff);
    border: 5px solid #51301c;
    border-radius: 18px;
    box-shadow: 0 10px 0 #382014, 0 18px 30px #0003;
  }
  #notice {
    margin-top: 16px;
    padding: 18px 20px;
    background: rgba(255,255,255,.92);
    border: 3px solid #51301c;
    border-radius: 16px;
    font-weight: 800;
    font-size: clamp(16px, 3.5vw, 22px);
    line-height: 1.7;
    color: #2a1b12;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>💩 うんこ崩し 💩</h1>
  <canvas id="game" width="720" height="620" aria-label="うんこ崩し サービス終了画面"></canvas>
  <div id="notice">「うんこ崩し」は、2026年8月27日をもちまして、サービス終了いたしました。</div>
</div>

<script>
const c = document.querySelector('#game');
const x = c.getContext('2d');

function poop(px, py, size) {
  x.font = `${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('💩', px, py);
}

function drawEndScreen() {
  x.clearRect(0, 0, c.width, c.height);

  x.globalAlpha = .55;
  x.fillStyle = '#fff';
  for (const [cx, cy] of [[100, 32], [590, 26]]) {
    x.beginPath();
    x.arc(cx, cy, 24, 0, Math.PI * 2);
    x.arc(cx + 27, cy + 4, 18, 0, Math.PI * 2);
    x.arc(cx - 25, cy + 6, 16, 0, Math.PI * 2);
    x.fill();
  }
  x.globalAlpha = 1;

  const rows = 5, cols = 9;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      poop(71 + col * 72, 79 + r * 72, 46);
    }
  }

  x.fillStyle = '#6b3e22';
  x.beginPath();
  x.roundRect(300, 565, 120, 17, 9);
  x.fill();

  x.fillStyle = '#a86a3d';
  x.beginPath();
  x.roundRect(308, 568, 104, 5, 3);
  x.fill();

  x.fillStyle = 'rgba(255,255,255,.72)';
  x.fillRect(0, 0, c.width, c.height);

  x.fillStyle = '#51301c';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.font = '900 34px system-ui, sans-serif';
  x.fillText('サービス終了', c.width / 2, 278);

  x.font = '700 19px system-ui, sans-serif';
  x.fillText('ご利用ありがとうございました。', c.width / 2, 325);
}

drawEndScreen();
</script>
</body>
</html>
